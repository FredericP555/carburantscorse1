name: Test C1 bouclier publication fix (temporary)

on:
  push:
    branches: [fix/c1-bouclier-publication]

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c1-bouclier-publication

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build real C1 V2 candidate
        run: python scripts/build_c1_v2_candidate.py

      - name: Prove real candidate publishes exact detector metadata
        run: |
          python - <<'PY'
          import json
          from scripts import c1_bouclier_meta

          candidate=json.load(open('outputs/c1-v2-candidate.json',encoding='utf-8'))
          summary=json.load(open('outputs/c1-v2-summary.json',encoding='utf-8'))
          detected=(summary.get('engine') or {}).get('bouclier')
          published=c1_bouclier_meta.validate_detector_bouclier(
              candidate.get('meta') or {}, detected
          )
          assert isinstance(published['Gazole']['ranges'], list)
          assert isinstance(published['SP95']['ranges'], list)
          assert summary['rewritten_daily_rows_total'] == 0
          assert summary['added_daily_rows_total'] == 0
          print('C1 candidate bouclier metadata exactly matches detector output')
          print('No published daily price row was rewritten or added during this metadata repair test')
          print('Gazole ranges:', published['Gazole']['ranges'])
          print('SP95 ranges:', published['SP95']['ranges'])
          PY
