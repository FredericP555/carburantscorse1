name: Update fuel observatory weekly

on:
  schedule:
    # GitHub cron is UTC. Two slots allow an exact 07:07 Europe/Paris schedule year-round;
    # the first step keeps only the slot matching the current CET/CEST offset.
    - cron: '7 5 * * 1'
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: c1-main-writers
  cancel-in-progress: false

env:
  PYTHONPATH: .:scripts

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Select the 07:07 Europe/Paris slot and avoid a duplicate scheduled publication
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get('EVENT_NAME')
          paris = datetime.now(ZoneInfo('Europe/Paris'))

          if event == 'workflow_dispatch':
              run = True
          else:
              offset_hours = int(paris.utcoffset().total_seconds() // 3600)
              expected_utc_hour = (7 - offset_hours) % 24
              schedule = os.environ.get('EVENT_SCHEDULE', '')
              try:
                  scheduled_hour = int(schedule.split()[1])
              except Exception:
                  scheduled_hour = -1
              run = scheduled_hour == expected_utc_hour

              if run:
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{os.environ['REPOSITORY']}/releases?per_page=20",
                          headers={
                              'Accept': 'application/vnd.github+json',
                              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                              'X-GitHub-Api-Version': '2022-11-28',
                              'User-Agent': 'A4C-weekly-guard',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          releases = json.load(response)

                      today = paris.date()
                      already_published = False
                      for release in releases:
                          tag = str(release.get('tag_name') or '')
                          published = release.get('published_at')
                          if not tag.startswith('a4c-v2-shared-') or not published:
                              continue
                          stamp = datetime.fromisoformat(published.replace('Z', '+00:00')).astimezone(ZoneInfo('Europe/Paris'))
                          if stamp.date() == today:
                              already_published = True
                              print(f'Validated C1 release already published today: {tag}')
                              break

                      if already_published:
                          run = False
                  except Exception as exc:
                      # Reliability first: if the duplicate guard cannot be checked,
                      # let the scheduled production run rather than miss the update.
                      print(f'WARNING: duplicate-publication guard unavailable: {exc}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run={'true' if run else 'false'}\n")
          print('Run selected:', run)
          PY

      - name: Checkout triggering ref
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture writer base SHA
        if: steps.clock.outputs.run == 'true'
        run: echo "WRITER_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Unit tests
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Compile V2 production sources
        if: steps.clock.outputs.run == 'true'
        run: python -m compileall -q a4c_common scripts

      - name: Verify recovered historical editorial method
        if: steps.clock.outputs.run == 'true'
        run: python scripts/validate_editorial_history.py

      - name: Prefetch official annual ZIPs once with retries
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/official-fuel
          current_year=$(python -c "from datetime import date; print(date.today().year)")
          previous_year=$((current_year-1))
          for year in "$previous_year" "$current_year"; do
            if [ "$year" = "$current_year" ]; then
              url="https://donnees.roulez-eco.fr/opendata/annee"
            else
              url="https://donnees.roulez-eco.fr/opendata/annee/$year"
            fi
            out=".cache/official-fuel/PrixCarburants_annuel_${year}.zip"
            tmp="${out}.tmp"
            curl --fail --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 600 \
              --user-agent "A4C-observatoire/2.0" \
              "$url" -o "$tmp"
            mv "$tmp" "$out"
          done
          python - <<'PY'
          import io, zipfile
          from datetime import date
          from pathlib import Path
          current=date.today().year
          for year in (current-1,current):
              p=Path(f'.cache/official-fuel/PrixCarburants_annuel_{year}.zip')
              raw=p.read_bytes()
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  if not any(n.lower().endswith('.xml') for n in zf.namelist()):
                      raise SystemExit(f'Official ZIP {year} contains no XML')
              print(f'Validated official ZIP {year}: {len(raw):,} bytes')
          PY

      - name: Fetch the single C1-owned UFIP Rotterdam source
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_ufip.py --output-dir outputs/ufip

      - name: Resolve only new or unresolved Corsica station IDs
        if: steps.clock.outputs.run == 'true'
        run: >-
          python scripts/resolve_corse_station_brands_incremental.py
          --output config/corse_station_brands.json
          --corrections config/corse_station_brand_corrections.csv

      - name: Build C1 V2 candidate
        if: steps.clock.outputs.run == 'true'
        run: python scripts/build_c1_v2_candidate.py

      - name: Verify C1 V2 promotion contract
        if: steps.clock.outputs.run == 'true'
        run: python scripts/promote_c1_v2_candidate.py

      - name: Build complete C1 to C2 V2 bundle
        if: steps.clock.outputs.run == 'true'
        run: python scripts/export_shared_c2_snapshot.py

      - name: Validate complete C1 to C2 V2 contract
        if: steps.clock.outputs.run == 'true'
        run: python scripts/validate_shared_c2_snapshot.py

      - name: Detect C1 data change
        if: steps.clock.outputs.run == 'true'
        id: changed
        shell: bash
        run: |
          if cmp -s data.json outputs/c1-v2-candidate.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "C1 data candidate is an exact no-op."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "C1 has publishable V2 data changes."
          fi

      - name: Promote verified C1 V2 candidate in workspace
        if: steps.clock.outputs.run == 'true'
        run: python scripts/promote_c1_v2_candidate.py --promote

      - name: Commit updated C1 data and Corsica station registry
        if: steps.clock.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          set -euo pipefail
          git add data.json config/corse_station_brands.json
          if git diff --cached --quiet; then
            echo "No C1 repository data/registry commit required."
            exit 0
          fi
          git fetch origin "+refs/heads/${GITHUB_REF_NAME:-main}:refs/remotes/origin/${GITHUB_REF_NAME:-main}"
          remote_sha=$(git rev-parse "origin/${GITHUB_REF_NAME:-main}")
          if [ "$remote_sha" != "$WRITER_BASE_SHA" ]; then
            echo "Main advanced while this writer was running: base=$WRITER_BASE_SHA remote=$remote_sha" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update C1 V2 fuel data $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish validated C1 V2 shared release
        if: steps.clock.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${GITHUB_REF_NAME:-main}:refs/remotes/origin/${GITHUB_REF_NAME:-main}"
          remote_sha=$(git rev-parse "origin/${GITHUB_REF_NAME:-main}")
          target="$(git rev-parse HEAD)"
          if [ "$remote_sha" != "$target" ]; then
            echo "Main advanced while this writer was running: local=$target remote=$remote_sha" >&2
            exit 1
          fi
          tag="a4c-v2-shared-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            outputs/shared/official_13_20.csv.gz \
            outputs/shared/official_13_20_events.csv.gz \
            outputs/shared/official_13_20.meta.json \
            outputs/ufip/rotterdam_gazole_observed.csv \
            outputs/ufip/rotterdam_gazole_daily.csv \
            config/corse_station_brands.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "A4C V2 shared official bundle $(date -u +%Y-%m-%d)" \
            --notes "Bundle C1→C2 V2 validé : prix officiels 13/20, ruptures/fermetures, Rotterdam UFIP, phases de bouclier et registre des enseignes corses, liés par SHA-256." \
            --latest=false

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("a4c-v2-shared-"))] | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' \
            | while read -r old_tag; do
                [ -z "$old_tag" ] && continue
                gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || \
                  echo "Cleanup skipped for $old_tag"
              done

      - name: Upload C1 weekly audit
        if: steps.clock.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-v2-weekly-audit
          path: |
            outputs/c1-v2-candidate.json
            outputs/c1-v2-summary.json
            outputs/shared/official_13_20.meta.json
            config/corse_station_brands.json
          retention-days: 30

      - name: Rebuild GitHub Pages
        if: steps.clock.outputs.run == 'true' && steps.changed.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --retry 3 --retry-delay 3 -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-response.json
          echo "Pages API HTTP $code"
          test "$code" = "201"

      - name: Write concise weekly summary
        if: steps.clock.outputs.run == 'true' && always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## C1 V2 weekly production')
          p=Path('outputs/c1-v2-summary.json')
          if p.exists():
              o=json.loads(p.read_text(encoding='utf-8'))
              r=(o.get('engine') or {}).get('r2') or {}
              print(f"- Data through: {o.get('target_end')}")
              print(f"- Protected daily rows: {o.get('protected_daily_rows_verified',0):,}")
              print(f"- Rewritten daily rows: {o.get('rewritten_daily_rows_total',0):,}")
              print(f"- Appended daily rows: {o.get('added_daily_rows_total',0):,}")
              print(f"- R2 calls: {r.get('calls',0):,}; unavailable: {r.get('unavailable',0):,}")
          print('Production branch:', '${{ github.ref_name }}')
          PY
