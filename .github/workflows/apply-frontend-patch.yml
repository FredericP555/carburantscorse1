name: Apply frontend automation patch

on:
  push:
    branches: [automation-v1]
    paths:
      - 'scripts/patch_frontend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v1
      - name: Add automation layer to index
        run: python scripts/patch_frontend.py
      - name: Commit patched index if needed
        run: |
          if git diff --quiet; then
            echo "No frontend patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load dynamic automation layer"
          git push origin automation-v1
