name: Clean automation development files

on:
  push:
    branches: [automation-v1]
    paths:
      - 'cleanup.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v1
      - name: Remove one-shot and diagnostic development files
        run: |
          git rm -f \
            .github/workflows/apply-frontend-patch.yml \
            .github/workflows/editorial-metrics.yml \
            .github/workflows/stage-candidate.yml \
            .github/workflows/test-pages-rebuild.yml \
            pages-rebuild-tested.txt \
            stage-candidate.trigger \
            test-pages-rebuild.trigger \
            scripts/check_editorial_metrics.py \
            scripts/check_recent_overlap.py \
            scripts/compare_candidate.py \
            scripts/debug_xml.py \
            scripts/diagnose_overlap.py \
            scripts/inspect_station_outliers.py \
            scripts/patch_frontend.py \
            scripts/test_bouclier_counterfactual.py \
            scripts/test_department_weighting.py \
            scripts/test_total_counterfactual.py \
            scripts/update_data.py \
            scripts/validate_aggregations.py \
            cleanup.trigger \
            .github/workflows/cleanup-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean automation development diagnostics"
          git push origin automation-v1
