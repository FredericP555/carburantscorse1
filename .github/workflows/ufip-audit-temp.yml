name: Temporary UFIP download audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python -m pip install --quiet requests beautifulsoup4 openpyxl
      - name: Test direct UFIP Gazole Rotterdam download
        run: |
          cat > /tmp/probe_ufip.py <<'PY'
          import io, re
          import requests
          from bs4 import BeautifulSoup
          from openpyxl import load_workbook

          URL='https://valeurs.ufip.fr/datas/custom'
          s=requests.Session()
          s.headers.update({'User-Agent':'A4C-observatoire/1.0 (+automated public-data retrieval)'})
          g=s.get(URL,timeout=60)
          print('GET_STATUS',g.status_code)
          print('GET_CONTENT_TYPE',g.headers.get('content-type'))
          g.raise_for_status()
          soup=BeautifulSoup(g.text,'html.parser')
          token=soup.select_one('input[name="ufp_token"]')
          if not token or not token.get('value'):
            raise RuntimeError('ufp_token not found')
          token=token['value']
          form=soup.select_one('form#frm-data') or soup.find('form')
          print('FORM_ACTION',form.get('action') if form else None)
          print('FORM_METHOD',form.get('method') if form else None)
          print('TOKEN_LENGTH',len(token))

          payload={
            'ufp_token':token,
            'day_from':'01/08/2026',
            'day_to':'18/08/2026',
            'cotations[gazole]':'on',
          }
          r=s.post(URL,data=payload,timeout=90,allow_redirects=True)
          print('POST_STATUS',r.status_code)
          print('POST_FINAL_URL',r.url)
          print('POST_CONTENT_TYPE',r.headers.get('content-type'))
          print('POST_CONTENT_DISPOSITION',r.headers.get('content-disposition'))
          print('POST_BYTES',len(r.content))
          r.raise_for_status()
          if not r.content.startswith(b'PK'):
            print('POST_PREFIX',r.text[:500].replace('\n',' | '))
            raise RuntimeError('response is not an XLSX ZIP container')

          wb=load_workbook(io.BytesIO(r.content),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
            print('SHEET',ws.title,'ROWS',ws.max_row,'COLS',ws.max_column)
            for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,12),values_only=True):
              print('ROW',repr(row))
          PY
          python /tmp/probe_ufip.py
