name: Build V2 prep bundle

# Isolated prep workflow: never modifies production data.json or production releases.
on:
  push:
    branches: [prep/v2-live-dry-run]
    paths: [.github/workflows/v2-prep-bundle.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch UFIP Rotterdam Gazole once
        run: python scripts/fetch_ufip.py --output-dir outputs/ufip

      - name: Refresh only new or unresolved Corsica station identities
        run: >-
          python scripts/resolve_corse_station_brands_incremental.py
          --output config/corse_station_brands.json
          --corrections config/corse_station_brand_corrections.csv

      - name: Build complete prep shared bundle
        run: python scripts/export_shared_c2_snapshot.py

      - name: Validate prep shared bundle
        run: python scripts/validate_shared_c2_snapshot.py

      - name: Publish isolated prerelease for C2 dry-run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits/v2
          tag="a4c-prep-v2-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          target="$(git rev-parse HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          {
            echo "target=$target"
            echo "tag=$tag"
            gh --version
            gh auth status
            gh release create "$tag" \
              outputs/shared/official_13_20.csv.gz \
              outputs/shared/official_13_20.meta.json \
              outputs/ufip/rotterdam_gazole_observed.csv \
              outputs/ufip/rotterdam_gazole_daily.csv \
              config/corse_station_brands.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "A4C V2 prep bundle $(date -u +%Y-%m-%d)" \
              --notes "PREP ONLY — isolated real-data bundle for V2 dry-run. Not consumed by production C2." \
              --prerelease
          } 2>&1 | tee audits/v2/c1-prep-release-publish.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '{tag:.tag_name,target_commitish:.target_commitish,published_at:.published_at,prerelease:.prerelease,assets:[.assets[].name]}' \
            > audits/v2/c1-prep-release.json
          echo "Prep release: $tag target=$target" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist release publication audit
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p audits/v2
          test -f audits/v2/c1-prep-release-publish.txt || echo "release step did not produce a log" > audits/v2/c1-prep-release-publish.txt
          git add audits/v2/c1-prep-release-publish.txt
          test ! -f audits/v2/c1-prep-release.json || git add audits/v2/c1-prep-release.json
          git diff --cached --quiet && exit 0
          git commit -m "Record C1 V2 prep release publication"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload prep bundle audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-v2-prep-bundle
          path: |
            outputs/shared/official_13_20.csv.gz
            outputs/shared/official_13_20.meta.json
            outputs/ufip/rotterdam_gazole_observed.csv
            outputs/ufip/rotterdam_gazole_daily.csv
            config/corse_station_brands.json
            audits/v2/c1-prep-release-publish.txt
            audits/v2/c1-prep-release.json
          retention-days: 14
