name: Validate C1 editorial changes

on:
  pull_request:
    paths:
      - 'editorial-patch.js'
      - 'scripts/enrich_data_meta.py'
      - 'scripts/c1_v2_contracts.py'
      - 'tests/test_c1_editorial_automation.py'
      - '.github/workflows/validate-editorial-pr.yml'

permissions:
  contents: read

jobs:
  editorial-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:scripts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Compile changed Python modules
        run: python -m py_compile scripts/enrich_data_meta.py scripts/c1_v2_contracts.py tests/test_c1_editorial_automation.py
      - name: Test editorial indicators
        run: python -m unittest discover -s tests -p 'test_c1_editorial_automation.py' -v
      - name: Validate JavaScript syntax
        run: node --check editorial-patch.js
