name: Watchdog C1 weekly publication

on:
  schedule:
    # 09:17 and 10:17 Europe/Paris across CET/CEST.
    - cron: '17 7 * * 1'
    - cron: '17 8 * * 1'
    - cron: '17 9 * * 1'
  push:
    branches:
      - main
    paths:
      - .github/workflows/watchdog-weekly.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Select watchdog slot
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get('EVENT_NAME', '')
          dry_run = event == 'push'
          if event in {'workflow_dispatch', 'push'}:
              selected = True
          else:
              schedule = os.environ.get('EVENT_SCHEDULE', '')
              try:
                  minute, hour, _, _, dow = schedule.split()
                  minute = int(minute)
                  hour = int(hour)
                  dow = int(dow)
              except Exception:
                  minute, hour, dow = -1, -1, -1

              offset = int(datetime.now(ZoneInfo('Europe/Paris')).utcoffset().total_seconds() // 3600)
              shifted = hour + offset
              local_hour = shifted % 24
              local_dow = (dow + (shifted // 24)) % 7
              selected = minute == 17 and local_dow == 1 and local_hour in {9, 10}

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"selected={'true' if selected else 'false'}\n")
              fh.write(f"dry_run={'true' if dry_run else 'false'}\n")
          print('Watchdog slot selected:', selected)
          print('Dry-run self-test:', dry_run)
          PY

      - name: Evaluate C1 business publication state
        if: steps.clock.outputs.selected == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          today=$(TZ=Europe/Paris date +%F)
          release_json=$(gh release list \
            --repo FredericP555/carburantscorse1 \
            --limit 50 \
            --json tagName,publishedAt)

          latest_today=$(RELEASE_JSON="$release_json" TODAY="$today" python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          items = json.loads(os.environ['RELEASE_JSON'])
          today = os.environ['TODAY']
          rows = []
          for item in items:
              tag = str(item.get('tagName') or '')
              published = item.get('publishedAt')
              if not tag.startswith('a4c-v2-shared-') or not published:
                  continue
              local = datetime.fromisoformat(published.replace('Z', '+00:00')).astimezone(ZoneInfo('Europe/Paris'))
              if local.date().isoformat() == today:
                  rows.append((published, tag))
          print(max(rows)[1] if rows else '')
          PY
          )

          active_update=$(gh run list \
            --repo FredericP555/carburantscorse1 \
            --workflow update-weekly.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status != "completed")] | length')

          active_verify=$(gh run list \
            --repo FredericP555/carburantscorse1 \
            --workflow verify-c1-publication.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status != "completed")] | length')

          business_run=""
          if [ -n "$latest_today" ]; then
            rm -rf /tmp/c1-business-receipts
            mkdir -p /tmp/c1-business-receipts
            while read -r run_id; do
              [ -z "$run_id" ] && continue
              dir="/tmp/c1-business-receipts/$run_id"
              mkdir -p "$dir"
              if gh run download "$run_id" \
                   --repo FredericP555/carburantscorse1 \
                   --name c1-business-success-receipt \
                   --dir "$dir" >/dev/null 2>&1; then
                receipt="$dir/c1-business-success.json"
                if [ -f "$receipt" ] && jq -e --arg tag "$latest_today" \
                     '.status == "business-success" and .release_tag == $tag and .pages_sha256 == .expected_sha256 and .release_data_sha256 == .expected_sha256' \
                     "$receipt" >/dev/null; then
                  business_run="$run_id"
                  break
                fi
              fi
            done < <(gh run list \
              --repo FredericP555/carburantscorse1 \
              --workflow verify-c1-publication.yml \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
          fi

          if [ -z "$latest_today" ]; then
            if [ "$active_update" -gt 0 ]; then
              action="wait"
              reason="no C1 release exists today, but a full production update is already active"
            else
              action="full-update"
              reason="no validated C1 release exists today"
            fi
          elif [ -n "$business_run" ]; then
            action="none"
            reason="C1 business success is proven for today's latest release: $latest_today (verifier run $business_run)"
          elif [ "$active_update" -gt 0 ] || [ "$active_verify" -gt 0 ]; then
            action="wait"
            reason="publication exists but production or end-to-end verification is still active"
          else
            action="repair-publication"
            reason="C1 release exists but no matching end-to-end business-success receipt proves what Pages serves"
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "release_today=$latest_today" >> "$GITHUB_OUTPUT"
          echo "business_run=$business_run" >> "$GITHUB_OUTPUT"
          echo "active_updates=$active_update" >> "$GITHUB_OUTPUT"
          echo "active_verifiers=$active_verify" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

      - name: Dispatch full C1 production update
        if: steps.clock.outputs.selected == 'true' && steps.clock.outputs.dry_run != 'true' && steps.state.outputs.action == 'full-update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-weekly.yml \
            --repo FredericP555/carburantscorse1 \
            --ref "${{ github.event.repository.default_branch }}"
          echo "C1 weekly production dispatched because no validated release exists for the cycle."

      - name: Rebuild Pages and re-run C1 business verification
        if: steps.clock.outputs.selected == 'true' && steps.clock.outputs.dry_run != 'true' && steps.state.outputs.action == 'repair-publication'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 3 -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-response.json
          echo "Pages API HTTP $code"
          test "$code" = "201"
          gh workflow run verify-c1-publication.yml \
            --repo FredericP555/carburantscorse1 \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Pages rebuild requested and C1 business verifier dispatched."

      - name: Write watchdog summary
        if: steps.clock.outputs.selected == 'true' && always()
        run: |
          {
            echo '## C1 business-aware weekly watchdog'
            echo "- Latest C1 release today: ${{ steps.state.outputs.release_today || 'none' }}"
            echo "- Matching business-success run: ${{ steps.state.outputs.business_run || 'none' }}"
            echo "- Active full C1 runs: ${{ steps.state.outputs.active_updates || '0' }}"
            echo "- Active C1 business verifiers: ${{ steps.state.outputs.active_verifiers || '0' }}"
            echo "- Decision: ${{ steps.state.outputs.action || 'not evaluated' }}"
            echo "- Dry-run self-test: ${{ steps.clock.outputs.dry_run == 'true' }}"
            echo "- Reason: ${{ steps.state.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
