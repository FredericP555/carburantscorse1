name: Sync unified bouclier metadata (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_sync_unified_bouclier_meta.yml'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Recompute metadata only
        run: |
          cp data.json data-before.json
          cp data.json data-meta-candidate.json
          python scripts/enrich_data_meta.py --input data-meta-candidate.json
          cp data-meta-candidate.json data-candidate.json
          python scripts/validate_meta.py
      - name: Prove public fuel series are byte-equivalent as JSON values
        run: |
          python - <<'PY'
          import json
          before=json.load(open('data-before.json',encoding='utf-8'))
          after=json.load(open('data-meta-candidate.json',encoding='utf-8'))
          assert set(before)==set(after), (set(before),set(after))
          for key in before:
              if key!='meta':
                  assert before[key]==after[key], f'public payload changed at top-level key {key}'
          b=after['meta']['bouclier']
          assert b['Gazole']['rule']['min_total_at_cap_count']==1
          assert b['Gazole']['rule']['confirmation_days']==2
          assert b['Gazole']['rule']['fill_gap_days']==1
          assert b['Gazole']['rule']['cap_tolerance_below_cents']==0.2
          assert b['Gazole']['rule']['cap_tolerance_above_cents']==0.1
          assert b['SP95']['rule']==b['Gazole']['rule']
          print('PUBLIC SERIES UNCHANGED; unified bouclier metadata verified')
          print('Gazole ranges:',b['Gazole']['ranges'])
          print('SP95 ranges:',b['SP95']['ranges'])
          PY
      - name: Promote metadata-only c1 data.json
        run: mv data-meta-candidate.json data.json
      - name: Build shared c1 to c2 snapshot
        run: python scripts/export_shared_c2_snapshot.py
      - name: Verify shared manifest carries exact c1 bouclier metadata
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data.json',encoding='utf-8'))
          meta=json.load(open('outputs/shared/official_13_20.meta.json',encoding='utf-8'))
          assert meta['bouclier']==data['meta']['bouclier']
          print('SHARED BOUCLIER METADATA EXACT MATCH')
          PY
      - name: Commit metadata-only update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && { echo 'Expected metadata change missing'; exit 1; }
          git commit -m "Apply unified effective-ceiling rule metadata"
          git push origin HEAD:main
      - name: Publish fresh shared snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="a4c-shared-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            outputs/shared/official_13_20.csv.gz \
            outputs/shared/official_13_20.meta.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "A4C shared snapshot - unified bouclier rule" \
            --notes "Snapshot normalisé 13/20 avec la règle unique de bouclier effectif partagée par c1 et c2." \
            --latest=false
      - name: Rebuild c1 GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "Pages API HTTP $code"
          test "$code" = "201"
