# Incremental Corsica station-brand registry maintenance
name: Update Corsica station brands

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_corse_station_brands.py'
      - 'scripts/resolve_corse_station_brands_incremental.py'
      - 'scripts/ensure_station_brand_registry_policy.py'
      - 'scripts/test_station_brands.py'
      - 'config/corse_station_brand_corrections.csv'
      - '.github/workflows/update-station-brands.yml'

permissions:
  contents: write

concurrency:
  group: c1-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Capture writer base SHA
        run: echo "WRITER_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Test brand parser and temporal incremental classification
        run: python scripts/test_station_brands.py

      - name: Resolve and periodically reverify Corsica station brands
        run: >-
          python scripts/resolve_corse_station_brands_incremental.py
          --output config/corse_station_brands.json
          --corrections config/corse_station_brand_corrections.csv

      - name: Persist current station-brand policy metadata
        run: >-
          python scripts/ensure_station_brand_registry_policy.py
          --path config/corse_station_brands.json

      - name: Validate compact registry quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import os
          import subprocess

          p=Path('config/corse_station_brands.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='a4c-corsica-station-brands-v2'

          # Registry coverage guard: compare with the persisted baseline instead of enforcing
          # an arbitrary fixed count. A small natural change (for example 96 -> 95) is allowed,
          # while a sudden collapse of more than 20% is rejected. The low absolute floor remains
          # as a last-resort protection against a broken or unexpectedly empty source.
          current_count=int(d['current_station_count'])
          minimum_count=60
          maximum_drop=0.20
          assert current_count >= minimum_count, (
              f"Registry population below absolute safety floor: {current_count} < {minimum_count}"
          )

          base_sha=(os.environ.get('WRITER_BASE_SHA') or '').strip()
          assert base_sha, 'WRITER_BASE_SHA is required for registry population guard'
          baseline_raw=subprocess.check_output(
              ['git','show',f'{base_sha}:config/corse_station_brands.json'],
              text=True,
          )
          baseline=json.loads(baseline_raw)
          previous_count=int(baseline['current_station_count'])
          assert previous_count > 0, previous_count
          drop=max(0.0,(previous_count-current_count)/previous_count)
          assert drop <= maximum_drop, (
              f"Sudden registry population drop: {previous_count} -> {current_count} "
              f"({drop:.1%}) > {maximum_drop:.0%}"
          )
          print(
              f"Registry population guard: previous={previous_count}, current={current_count}, "
              f"drop={drop:.1%}, floor={minimum_count}"
          )

          assert d['verified_brand_count'] >= d['current_station_count'] - 10
          assert set(d['segment_counts_current']) == {'gms_lowcost','traditionnel','inconnu'}
          classification=d.get('classification') or {}
          assert classification.get('brand_reverify_days') == 90
          assert classification.get('brand_reverify_limit_per_run') == 12

          allowed={'enseigne','segment','detail','classification_source','brand_source',
                   'active','first_seen','last_seen','verified_at','brand_valid_from','brand_history'}
          assert all(set(v).issubset(allowed) for v in d['stations'].values())
          assert not any(any(k in v for k in ('address','city','cp','latitude','longitude'))
                         for v in d['stations'].values())
          for entry in d['stations'].values():
              history=entry.get('brand_history') or []
              assert isinstance(history, list)
              for period in history:
                  assert isinstance(period, dict)
                  assert period.get('valid_from') and period.get('valid_to')
                  assert period['valid_from'] <= period['valid_to']

          active=[v for v in d['stations'].values() if v.get('active')]
          brands=[str(v.get('enseigne') or '').casefold() for v in active]
          assert any('total' in b for b in brands), 'TotalEnergies absent'
          assert any(b.startswith('vito') for b in brands), 'VITO absent'
          assert any(b == 'eni' or b.startswith('eni ') for b in brands), 'ENI absent'

          print('Registry OK:', d['current_station_count'], d['segment_counts_current'],
                'unknown=', d['unresolved_current_count'])
          PY

      - name: Commit registry if changed
        run: |
          if git diff --quiet -- config/corse_station_brands.json; then
            echo 'No station-brand changes.'
            exit 0
          fi
          git fetch origin "+refs/heads/${GITHUB_REF_NAME:-main}:refs/remotes/origin/${GITHUB_REF_NAME:-main}"
          remote_sha=$(git rev-parse "origin/${GITHUB_REF_NAME:-main}")
          if [ "$remote_sha" != "$WRITER_BASE_SHA" ]; then
            echo "Main advanced while this writer was running: base=$WRITER_BASE_SHA remote=$remote_sha" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/corse_station_brands.json
          git commit -m 'Refresh temporal Corsica station brands'
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
