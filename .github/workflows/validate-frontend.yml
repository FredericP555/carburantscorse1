name: Validate automated dashboard in browser

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check dashboard JavaScript syntax
        run: |
          node --check automation.js
          node --check editorial-patch.js

      - name: Verify gap date alignment and explain TTC vs HT peaks
        run: |
          python - <<'PY'
          import json
          from datetime import date,timedelta
          d=json.load(open('data.json',encoding='utf-8'))
          origin=date(2022,1,1)
          regions=['moy_regions','Auvergne-Rhône-Alpes','Bourgogne-Franche-Comté','Bretagne','Centre-Val de Loire','Grand Est','Hauts-de-France','Île-de-France','Normandie','Nouvelle-Aquitaine','Occitanie','PACA','Pays de la Loire']
          def day(offset):
              return (origin+timedelta(days=int(offset))).isoformat()
          for fuel in ('G','S'):
              base=d[fuel]['corse']['d']
              base_keys=[p[0] for p in base]
              assert len(base_keys)==len(set(base_keys)), f'{fuel} Corse duplicate dates'
              for key in regions:
                  pts=d[fuel][key]['d']
                  keys=[p[0] for p in pts]
                  assert len(keys)==len(set(keys)), f'{fuel} {key} duplicate dates'
                  missing=sorted(set(base_keys)-set(keys))
                  print(f'{fuel} {key}: corse={len(base_keys)} region={len(keys)} common_dates={len(set(base_keys)&set(keys))}')
                  if missing:
                      print('  missing vs Corse:',', '.join(day(x) for x in missing[:10]))
              reg={p[0]:p for p in d[fuel]['moy_regions']['d']}
              recent=base[-366:]
              values=[]
              for c in recent:
                  r=reg.get(c[0])
                  if not r or c[1] is None or r[1] is None or c[2] is None or r[2] is None:
                      continue
                  values.append((c[0],(c[1]-r[1])*100,(c[2]-r[2])*100))
              if values:
                  max_ttc=max(values,key=lambda x:x[1])
                  max_ht=max(values,key=lambda x:x[2])
                  print(f'{fuel} last-12m max TTC gap: {day(max_ttc[0])} = {max_ttc[1]:.2f} c/L')
                  print(f'{fuel} last-12m max HT gap : {day(max_ht[0])} = {max_ht[2]:.2f} c/L')
          PY

      - name: Build expected dynamic labels from data.json
        run: |
          python - <<'PY' > /tmp/expected.env
          import json
          d=json.load(open('data.json',encoding='utf-8'))
          y,m,day=map(int,d['meta']['last_date'].split('-'))
          months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']
          print('LAST_UPPER="'+f'{day} {months[m-1]} {y}'.upper()+'"')
          print('MONTH_YEAR_LOWER="'+f'{months[m-1]} {y}'+'"')
          gap=d['meta']['editorial']['Gazole']['observed_ytd_gap']
          print('GAP="'+f'{gap:+.1f}'.replace('.',',')+'"')
          PY
          cat /tmp/expected.env

      - name: Start local static server
        run: |
          python3 -m http.server 8000 > /tmp/a4c-http.log 2>&1 &
          sleep 2

      - name: Find Chrome
        id: chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not available on runner"
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Render desktop dashboard
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=1280,900 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/desktop.html

      - name: Verify wide desktop uses full period and editorial flow
        run: |
          source /tmp/expected.env
          grep -q "CLASSEMENT AU $LAST_UPPER" /tmp/desktop.html
          grep -q "Historique disponible : janvier 2022 – $MONTH_YEAR_LOWER" /tmp/desktop.html
          grep -q "$GAP" /tmp/desktop.html
          ! grep -q "CLASSEMENT AU 28 MAI 2026" /tmp/desktop.html
          grep -E -q 'id="periodControl"[^>]*display: none' /tmp/desktop.html
          grep -q 'class="analyse-flow"' /tmp/desktop.html
          grep -q 'column-count:2' /tmp/desktop.html
          grep -q 'Plafond TotalEnergies suivi' /tmp/desktop.html
          grep -q 'Bouclier' /tmp/desktop.html
          python - <<'PY'
          s=open('/tmp/desktop.html',encoding='utf-8').read()
          assert '2 — EFFETS DES ACTIONS TOTALENERGIES' in s
          assert 'moyenne journalière HT' in s
          assert s.index('2 — EFFETS DES ACTIONS TOTALENERGIES') < s.index('moyenne journalière HT')
          print('Editorial source follows section 2: OK')
          PY
          echo "Wide desktop integration and editorial flow: OK"

      - name: Render mobile portrait dashboard
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/portrait.html

      - name: Verify mobile portrait gets period control
        run: |
          grep -q 'id="periodSlider"' /tmp/portrait.html
          grep -q '12 derniers mois' /tmp/portrait.html
          grep -E -q 'id="periodControl"[^>]*display: flex' /tmp/portrait.html
          echo "Mobile portrait integration: OK"

      - name: Render narrow iframe-like dashboard
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=600,500 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/narrow-iframe.html

      - name: Verify narrow iframe gets period control
        run: |
          grep -E -q 'id="periodControl"[^>]*display: flex' /tmp/narrow-iframe.html
          grep -q '12 derniers mois' /tmp/narrow-iframe.html
          echo "Narrow iframe integration: OK"

      - name: Render WordPress-like 835px iframe
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=835,650 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/iframe-835.html

      - name: Verify 835px iframe gets period control
        run: |
          grep -E -q 'id="periodControl"[^>]*display: flex' /tmp/iframe-835.html
          grep -q '12 derniers mois' /tmp/iframe-835.html
          grep -q 'class="analyse-flow"' /tmp/iframe-835.html
          echo "835px iframe integration: OK"

      - name: Render classic 1000px embed with sidebar
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=1000,700 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/embed-1000.html

      - name: Verify 1000px embed gets period control
        run: |
          grep -E -q 'id="periodControl"[^>]*display: flex' /tmp/embed-1000.html
          grep -q '12 derniers mois' /tmp/embed-1000.html
          echo "1000px embed integration: OK"

      - name: Render mobile landscape dashboard
        run: |
          "${{ steps.chrome.outputs.path }}" --headless --no-sandbox --disable-gpu --window-size=844,390 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > /tmp/landscape.html

      - name: Verify narrow landscape gets period control too
        run: |
          grep -E -q 'id="periodControl"[^>]*display: flex' /tmp/landscape.html
          grep -q '12 derniers mois' /tmp/landscape.html
          echo "Narrow landscape integration: OK"
