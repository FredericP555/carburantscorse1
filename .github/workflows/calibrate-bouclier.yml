name: Calibrate effective TotalEnergies ceiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Fit stable transparent rule to historical yellow zones
        run: python scripts/calibrate_bouclier_stable.py
