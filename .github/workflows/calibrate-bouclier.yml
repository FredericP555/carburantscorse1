name: Calibrate effective TotalEnergies ceiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Fit stable transparent rule to historical yellow zones
        run: python scripts/calibrate_bouclier_stable.py
