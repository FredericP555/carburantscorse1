name: Audit final three hypotheses

on:
  push:
    branches:
      - audit/final-three-hypotheses
    paths:
      - 'audit/final_three_c1.py'
      - '.github/workflows/audit-final-three-hypotheses.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: H1 inspect official Folelli lineage evidence
        run: python audit/final_three_c1.py folelli | tee /tmp/folelli.json
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/a4c-audit-http.log 2>&1 &
          sleep 2
      - name: Find Chrome
        id: chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: H3 render each viewport twice after stabilization
        run: |
          set -euo pipefail
          CHROME='${{ steps.chrome.outputs.path }}'
          for spec in desktop:1280,900 portrait:390,844 landscape:844,390; do
            name=${spec%%:*}
            size=${spec#*:}
            for pass in 1 2; do
              "$CHROME" --headless --no-sandbox --disable-gpu \
                --window-size="$size" --virtual-time-budget=12000 \
                --dump-dom http://127.0.0.1:8000/ > "/tmp/${name}-${pass}.html"
            done
          done
      - name: H3 validate stable canvas geometry and unique DOM ids
        run: >-
          python audit/final_three_c1.py canvas
          /tmp/desktop-1.html /tmp/desktop-2.html
          /tmp/portrait-1.html /tmp/portrait-2.html
          /tmp/landscape-1.html /tmp/landscape-2.html
