name: Test Pages rebuild permission

on:
  push:
    branches: [automation-v1]
    paths:
      - 'test-pages-rebuild.trigger'

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v1
      - name: Request rebuild of current public Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-response.json
          echo "HTTP $code"
          test "$code" = "201"
      - name: Record successful permission test on test branch
        run: |
          printf 'Pages rebuild request succeeded with HTTP 201\n' > pages-rebuild-tested.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-rebuild-tested.txt
          git commit -m "Record successful Pages rebuild permission test"
          git push origin automation-v1
