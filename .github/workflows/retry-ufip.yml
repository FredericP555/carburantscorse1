name: Retry UFIP after weekly update

on:
  schedule:
    # Monday retries at 11:17, 14:17, 17:17 and 20:17 Europe/Paris.
    # Two UTC slots per local time cover CET/CEST; the gate below keeps only one.
    - cron: '17 9 * * 1'
    - cron: '17 10 * * 1'
    - cron: '17 12 * * 1'
    - cron: '17 13 * * 1'
    - cron: '17 15 * * 1'
    - cron: '17 16 * * 1'
    - cron: '17 18 * * 1'
    - cron: '17 19 * * 1'
    # Final safety check Tuesday at 07:17 Europe/Paris.
    - cron: '17 5 * * 2'
    - cron: '17 6 * * 2'
  push:
    branches:
      - main
    paths:
      - .github/workflows/retry-ufip.yml
      - scripts/ufip_retry_policy.py
      - scripts/fetch_ufip.py
      - a4c_common/ufip.py
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PYTHONPATH: .:scripts

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Select the Europe/Paris retry slot
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT_NAME') in {'workflow_dispatch', 'push'}:
              selected = True
          else:
              schedule = os.environ.get('EVENT_SCHEDULE', '')
              try:
                  minute, hour, _, _, dow = schedule.split()
                  minute = int(minute)
                  hour = int(hour)
                  dow = int(dow)
              except Exception:
                  minute, hour, dow = -1, -1, -1

              offset = int(datetime.now(ZoneInfo('Europe/Paris')).utcoffset().total_seconds() // 3600)
              shifted = hour + offset
              local_hour = shifted % 24
              local_dow = (dow + (shifted // 24)) % 7
              selected = (
                  minute == 17
                  and (
                      (local_dow == 1 and local_hour in {11, 14, 17, 20})
                      or (local_dow == 2 and local_hour == 7)
                  )
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"selected={'true' if selected else 'false'}\n")
          print('Retry slot selected:', selected)
          PY

      - name: Checkout current production main
        if: steps.clock.outputs.selected == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        if: steps.clock.outputs.selected == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        if: steps.clock.outputs.selected == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Check UFIP data and shared-release contract freshness
        if: steps.clock.outputs.selected == 'true'
        id: ufip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ufip-baseline outputs/ufip-live

          tag=$(gh release list \
            --repo FredericP555/carburantscorse1 \
            --limit 50 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("a4c-v2-shared-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "No validated C1 V2 release found." >&2
            exit 1
          fi

          gh release download "$tag" \
            --repo FredericP555/carburantscorse1 \
            --pattern rotterdam_gazole_observed.csv \
            --dir outputs/ufip-baseline \
            --clobber
          gh release download "$tag" \
            --repo FredericP555/carburantscorse1 \
            --pattern official_13_20.meta.json \
            --dir outputs/ufip-baseline \
            --clobber

          python scripts/fetch_ufip.py --output-dir outputs/ufip-live

          BASELINE_TAG="$tag" python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import pandas as pd
          from scripts.ufip_retry_policy import should_retry_week

          baseline = pd.read_csv(Path('outputs/ufip-baseline/rotterdam_gazole_observed.csv'))
          live = pd.read_csv(Path('outputs/ufip-live/rotterdam_gazole_observed.csv'))
          release_meta = json.loads(Path('outputs/ufip-baseline/official_13_20.meta.json').read_text(encoding='utf-8'))
          today = datetime.now(ZoneInfo('Europe/Paris')).date()
          current_monday = today - timedelta(days=today.weekday())
          week_start = current_monday - timedelta(days=7)
          decision = should_retry_week(baseline, live, week_start, release_meta=release_meta)

          def max_date(df):
              if df.empty or 'date' not in df.columns:
                  return None
              values = pd.to_datetime(df['date'], errors='coerce').dropna()
              return values.max().date().isoformat() if not values.empty else None

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"ready={'true' if decision['ready'] else 'false'}\n")
              fh.write(f"reason={decision['reason']}\n")
              fh.write(f"contract_current={'true' if decision['release_contract_current'] else 'false'}\n")
              fh.write(f"week_start={decision['week_start']}\n")
              fh.write(f"week_end={decision['week_end']}\n")
              fh.write(f"baseline_max={max_date(baseline) or ''}\n")
              fh.write(f"live_max={max_date(live) or ''}\n")

          print(f"Previous week: {decision['week_start']} -> {decision['week_end']}")
          print(f"Baseline release: {os.environ['BASELINE_TAG']}")
          print(f"Baseline complete: {decision['baseline_complete']}; rows={decision['baseline_rows']}")
          print(f"Live complete: {decision['live_complete']}; rows={decision['live_rows']}")
          print(f"Release UFIP contract current: {decision['release_contract_current']}")
          print(f"Full C1 rerun required: {decision['ready']} ({decision['reason']})")
          PY

      - name: Dispatch full C1 production update
        if: steps.clock.outputs.selected == 'true' && steps.ufip.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-weekly.yml \
            --repo FredericP555/carburantscorse1 \
            --ref "${{ github.event.repository.default_branch }}"
          echo "C1 data or release-contract refresh required; full production update dispatched."

      - name: Write retry summary
        if: steps.clock.outputs.selected == 'true' && always()
        run: |
          {
            echo '## UFIP conditional retry'
            echo "- Week checked: ${{ steps.ufip.outputs.week_start }} → ${{ steps.ufip.outputs.week_end }}"
            echo "- Baseline observed through: ${{ steps.ufip.outputs.baseline_max }}"
            echo "- Live UFIP observed through: ${{ steps.ufip.outputs.live_max }}"
            echo "- Release UFIP contract current: ${{ steps.ufip.outputs.contract_current }}"
            echo "- Decision reason: ${{ steps.ufip.outputs.reason }}"
            echo "- Full C1 rerun dispatched: ${{ steps.ufip.outputs.ready == 'true' }}"
          } >> "$GITHUB_STEP_SUMMARY"
