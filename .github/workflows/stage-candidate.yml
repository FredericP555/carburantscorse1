name: Stage candidate data on automation branch

on:
  push:
    branches: [automation-v1]
    paths:
      - 'stage-candidate.trigger'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build append-only candidate
        run: python scripts/update_data_append.py --input data.json --output data-candidate.json
      - name: Validate candidate
        run: python scripts/validate_candidate.py
      - name: Enrich metadata
        run: python scripts/enrich_data_meta.py --input data-candidate.json
      - name: Validate metadata
        run: python scripts/validate_meta.py
      - name: Stage data.json on automation branch
        run: |
          mv data-candidate.json data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Stage automated data through latest official date"
          git push origin automation-v1
