name: Repair current C1 bouclier metadata (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_repair-c1-bouclier-once.yml'

permissions:
  contents: write
  pages: write

env:
  PYTHONPATH: .:scripts

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Recompute only C1 bouclier metadata
        run: |
          cp data.json data-before.json
          python - <<'PY'
          import json
          from copy import deepcopy
          from datetime import timedelta
          from pathlib import Path

          import bouclier_detector
          import c1_bouclier_meta
          import shield_phase_v2
          import update_data_v2 as core

          before = json.loads(Path('data-before.json').read_text(encoding='utf-8'))
          after = deepcopy(before)

          last_off = max(p[0] for p in before['G']['corse']['d'])
          last_date = core.ORIGIN + timedelta(days=last_off)
          detector = shield_phase_v2.with_cap_phases(
              bouclier_detector.metadata(last_date.year)
          )

          after['meta'] = c1_bouclier_meta.attach_detector_bouclier(
              before.get('meta') or {}, detector
          )
          c1_bouclier_meta.validate_detector_bouclier(after['meta'], detector)

          # Metadata-only repair: every public price-series payload must remain identical.
          assert set(before) == set(after), (set(before), set(after))
          for key in before:
              if key != 'meta':
                  assert before[key] == after[key], f'public payload changed at top-level key {key}'

          before_meta = deepcopy(before.get('meta') or {})
          after_meta = deepcopy(after.get('meta') or {})
          before_meta.pop('bouclier', None)
          after_meta.pop('bouclier', None)
          assert before_meta == after_meta, 'non-bouclier metadata changed during repair'

          assert isinstance(detector['Gazole']['ranges'], list)
          assert isinstance(detector['SP95']['ranges'], list)

          Path('data.json').write_text(
              json.dumps(after, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )
          print('Metadata-only C1 repair verified through', last_date)
          print('Gazole ranges:', detector['Gazole']['ranges'])
          print('SP95 ranges:', detector['SP95']['ranges'])
          PY

      - name: Verify only data metadata changed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path('data-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('data.json').read_text(encoding='utf-8'))
          for key in before:
              if key != 'meta':
                  assert before[key] == after[key], key
          assert after['meta']['bouclier']['Gazole']['ranges']
          assert after['meta']['bouclier']['SP95']['ranges']
          print('Verified: price series unchanged; bouclier metadata present.')
          PY

      - name: Commit repaired C1 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && { echo 'Expected bouclier metadata change missing'; exit 1; }
          git commit -m "Restore C1 bouclier metadata"
          git push origin HEAD:main

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "Pages API HTTP $code"
          test "$code" = "201"
