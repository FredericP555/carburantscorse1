name: Bootstrap shared A4C release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-shared-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build shared 13/20 official snapshot
        run: python scripts/export_shared_c2_snapshot.py

      - name: Verify shared snapshot manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data=Path('outputs/shared/official_13_20.csv.gz')
          meta=json.loads(Path('outputs/shared/official_13_20.meta.json').read_text(encoding='utf-8'))
          assert meta['schema']=='a4c-official-13-20-v1'
          assert meta['rows']>0
          assert meta['sha256']==hashlib.sha256(data.read_bytes()).hexdigest()
          print('Shared snapshot manifest: OK', meta['rows'], meta['max_date'], data.stat().st_size)
          PY

      - name: Publish bootstrap shared snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="a4c-shared-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          title="A4C shared official snapshot $(date -u +%Y-%m-%d)"
          gh release create "$tag" \
            outputs/shared/official_13_20.csv.gz \
            outputs/shared/official_13_20.meta.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Bootstrap du snapshot normalisé 13/20 pour les observatoires A4C. Déclarations officielles brutes uniquement, sans règle métier propre à c1 ou c2." \
            --latest=false
