name: C1 V2 live threshold dry-run

on:
  push:
    branches: [prep/v2-live-dry-run]
    paths: [.github/workflows/v2-live-c1-dry-run.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q a4c_common scripts

      - name: Fetch UFIP Rotterdam with stale-gap guard
        run: python scripts/fetch_ufip.py --output-dir outputs/ufip

      - name: Refresh only new or unresolved Corsica station identities
        run: >-
          python scripts/resolve_corse_station_brands_incremental.py
          --output config/corse_station_brands.json
          --corrections config/corse_station_brand_corrections.csv

      - name: Execute C1 real-data V2 threshold dry-run
        run: python scripts/dry_run_v2_candidate.py

      - name: Write concise C1 dry-run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p=pathlib.Path('outputs/v2/c1-v2-dry-run.json')
          if not p.exists():
              print('## C1 V2 live threshold dry-run\n\nArtifact not produced.')
              raise SystemExit(0)
          o=json.loads(p.read_text(encoding='utf-8'))
          e=o.get('engine_calls',{})
          print('## C1 V2 live threshold dry-run')
          print(f"- Window: {o.get('window',{}).get('retroactive_start')} → {o.get('window',{}).get('end')}")
          print(f"- Prospective switch: {o.get('window',{}).get('prospective_switch_date')}")
          print(f"- UFIP last observed: {o.get('source',{}).get('ufip_last_observed_date')}")
          print(f"- evaluate() station-days: {e.get('evaluate_station_days',0):,}")
          print(f"- R2 calls: {e.get('r2_calls',0):,} (true={e.get('r2_true',0):,}, false={e.get('r2_false',0):,}, unavailable={e.get('r2_unavailable',0):,})")
          for label, block in o.get('comparison',{}).items():
              changed=sum(v.get('changed_periods',0) for v in block.values())
              maximum=max((v.get('max_abs_delta_c_l',0) for v in block.values()), default=0)
              print(f"- {label}: {changed} changed periods across series; max |Δ|={maximum:.3f} c/L")
          print('- Production modified: no')
          PY

      - name: Persist C1 dry-run report on prep branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p audits/v2
          cp outputs/v2/c1-v2-dry-run.json audits/v2/latest-c1-live-dry-run.json
          git add audits/v2/latest-c1-live-dry-run.json
          git diff --cached --quiet && exit 0
          git commit -m "Store latest C1 V2 live dry-run audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload C1 V2 dry-run audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-v2-live-dry-run
          path: |
            outputs/v2/c1-v2-dry-run.json
            outputs/ufip/rotterdam_gazole_observed.csv
            outputs/ufip/rotterdam_gazole_daily.csv
          retention-days: 14
