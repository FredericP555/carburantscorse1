name: Check editorial metrics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recover current editorial formulas
        run: python scripts/check_editorial_metrics.py
      - name: Test Gazole counterfactual without TotalEnergies stations
        run: python scripts/test_total_counterfactual.py
