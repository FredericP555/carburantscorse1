name: Bootstrap shared bouclier release (temporary)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build shared snapshot with bouclier metadata
        run: |
          python scripts/export_shared_c2_snapshot.py
          python - <<'PY'
          import json
          m=json.load(open('outputs/shared/official_13_20.meta.json',encoding='utf-8'))
          assert set(m['bouclier'])=={'Gazole','SP95'}
          print(json.dumps(m['bouclier'],ensure_ascii=False,indent=2))
          PY
      - name: Publish bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="a4c-shared-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          gh release create "$tag" outputs/shared/official_13_20.csv.gz outputs/shared/official_13_20.meta.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "A4C shared official snapshot with bouclier metadata" \
            --notes "Bootstrap du manifeste partagé enrichi des métadonnées dynamiques du bouclier TotalEnergies." --latest=false
