name: Validate fuel data generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build append-only candidate
        run: python scripts/update_data_append.py --input data.json --output data-candidate.json

      - name: Validate candidate
        run: python scripts/validate_candidate.py

      - name: Upload candidate data.json
        uses: actions/upload-artifact@v4
        with:
          name: candidate-data-json
          path: data-candidate.json
          retention-days: 7
