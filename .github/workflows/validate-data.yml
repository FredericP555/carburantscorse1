name: Validate fuel data generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Run regression unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile V2 production sources
        run: python -m compileall -q a4c_common scripts

      - name: Verify station brand HTML parser
        run: python scripts/test_station_brands.py

      - name: Probe official live station-brand sources
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import update_corse_station_brands as s
          page=s._instant_api_page(0)
          print('instant API:', page.get('total_count'), 'records; first page', len(page.get('results', [])))
          brand,error=s.fetch_brand('20118001', timeout=15)
          print('official station page 20118001:', brand, error)
          assert page.get('total_count',0)>9000
          assert len(page.get('results',[]))>0
          assert brand and s.canonical_brand(brand)=='TotalEnergies', (brand,error)
          PY

      - name: Verify year-boundary generation window
        run: python scripts/test_year_boundary.py

      - name: Verify shared snapshot year window
        run: python scripts/test_shared_year_boundary.py

      - name: Verify unified bouclier rule
        run: python scripts/test_bouclier_rule.py

      - name: Verify recovered historical editorial method
        run: python scripts/validate_editorial_history.py

      - name: Prefetch official annual ZIPs once with production retries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/official-fuel
          current_year=$(python -c "from datetime import date; print(date.today().year)")
          previous_year=$((current_year-1))
          for year in "$previous_year" "$current_year"; do
            if [ "$year" = "$current_year" ]; then
              url="https://donnees.roulez-eco.fr/opendata/annee"
            else
              url="https://donnees.roulez-eco.fr/opendata/annee/$year"
            fi
            out=".cache/official-fuel/PrixCarburants_annuel_${year}.zip"
            tmp="${out}.tmp"
            curl --fail --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 600 \
              --user-agent "A4C-observatoire/2.0" \
              "$url" -o "$tmp"
            mv "$tmp" "$out"
          done
          python - <<'PY'
          import io, zipfile
          from datetime import date
          from pathlib import Path
          current=date.today().year
          for year in (current-1,current):
              p=Path(f'.cache/official-fuel/PrixCarburants_annuel_{year}.zip')
              raw=p.read_bytes()
              with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                  if not any(n.lower().endswith('.xml') for n in zf.namelist()):
                      raise SystemExit(f'Official ZIP {year} contains no XML')
              print(f'Validated official ZIP {year}: {len(raw):,} bytes')
          PY

      - name: Fetch the single C1-owned UFIP Rotterdam source
        run: python scripts/fetch_ufip.py --output-dir outputs/ufip

      - name: Resolve new, unresolved or due Corsica station IDs in workspace
        run: >-
          python scripts/resolve_corse_station_brands_incremental.py
          --output config/corse_station_brands.json
          --corrections config/corse_station_brand_corrections.csv

      - name: Build production C1 V2 candidate
        run: python scripts/build_c1_v2_candidate.py

      - name: Exercise production C1 V2 promotion guard
        run: python scripts/promote_c1_v2_candidate.py

      - name: Build complete production C1 to C2 V2 bundle
        run: python scripts/export_shared_c2_snapshot.py

      - name: Validate complete production C1 to C2 V2 contract
        run: python scripts/validate_shared_c2_snapshot.py

      - name: Upload production-shaped candidate and audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-v2-pr-validation
          path: |
            outputs/c1-v2-candidate.json
            outputs/c1-v2-summary.json
            outputs/shared/official_13_20.meta.json
            config/corse_station_brands.json
          retention-days: 7
