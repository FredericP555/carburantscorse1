name: Validate fuel data generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify station brand HTML parser
        run: python scripts/test_station_brands.py

      - name: Verify year-boundary generation window
        run: python scripts/test_year_boundary.py

      - name: Verify shared snapshot year window
        run: python scripts/test_shared_year_boundary.py

      - name: Verify unified bouclier rule
        run: python scripts/test_bouclier_rule.py

      - name: Verify station activity carry-forward policy
        run: python tests/test_station_activity_policy.py

      - name: Verify recovered historical editorial method
        run: python scripts/validate_editorial_history.py

      - name: Build append-only candidate
        run: python scripts/update_data_append.py --input data.json --output data-candidate.json

      - name: Build shared 13/20 official snapshot
        run: python scripts/export_shared_c2_snapshot.py

      - name: Verify shared snapshot manifest
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          data=Path('outputs/shared/official_13_20.csv.gz')
          meta=json.loads(Path('outputs/shared/official_13_20.meta.json').read_text(encoding='utf-8'))
          assert meta['schema']=='a4c-official-13-20-v1'
          assert meta['rows']>0
          assert meta['sha256']==hashlib.sha256(data.read_bytes()).hexdigest()
          with gzip.open(data,'rt',encoding='utf-8') as f:
              header=f.readline().strip()
          assert 'station_id' in header and 'price_in_reference_band' in header
          assert meta.get('bouclier') and set(meta['bouclier'])=={'Gazole','SP95'}
          print('Shared snapshot manifest: OK', meta['rows'], meta['max_date'], data.stat().st_size)
          PY

      - name: Audit Corsica station eligibility
        run: python scripts/station_audit.py --candidate data-candidate.json --previous data.json --write-meta

      - name: Validate candidate
        run: python scripts/validate_candidate.py

      - name: Add dynamic bouclier and editorial metadata
        run: python scripts/enrich_data_meta.py --input data-candidate.json

      - name: Validate metadata
        run: python scripts/validate_meta.py

      - name: Render weekly summary
        run: python scripts/weekly_summary.py --input data-candidate.json > weekly-summary.md

      - name: Upload candidate and audit summary
        uses: actions/upload-artifact@v4
        with:
          name: candidate-data-json
          path: |
            data-candidate.json
            weekly-summary.md
            outputs/shared/official_13_20.meta.json
          retention-days: 7
