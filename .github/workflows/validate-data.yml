name: Validate fuel data generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build diagnostic candidate
        run: python scripts/update_data_v2.py --input data.json --output data-new.json --tolerance 0.100

      - name: Compare daily date alignment
        run: python scripts/compare_candidate.py

      - name: Keep validation red during methodology diagnostics
        run: exit 1

      - name: Show resulting file size
        if: always()
        run: ls -lh data.json data-new.json || true

      - name: Upload candidate data.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-data-json
          path: data-new.json
          retention-days: 7
